# Veröffentlicht Keleo auf Cloudflare Workers + D1.
#
# Benötigte Repository-Secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API-Token mit der Vorlage «Edit Cloudflare Workers» (inkl. D1 Edit)
#   CLOUDFLARE_ACCOUNT_ID  Account-ID (Cloudflare-Dashboard → Workers & Pages → rechte Spalte)
#   KELEO_APP_PASSWORD     Anmeldepasswort für Keleo (nur beim ersten Lauf nötig, danach optional)
# Optional:
#   KELEO_RESEND_API_KEY, KELEO_MAIL_FROM  für den E-Mail-Versand über Resend
#
# Start: automatisch bei Änderungen in keleo/ auf main/master, oder manuell über
# Actions → «Deploy Keleo» → «Run workflow» (dort kann der Branch gewählt werden).
name: Deploy Keleo

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'keleo/**'
      - '.github/workflows/deploy-keleo.yml'

concurrency:
  group: deploy-keleo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keleo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keleo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Einrichten und veröffentlichen
        run: npm run cloud:setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KELEO_APP_PASSWORD: ${{ secrets.KELEO_APP_PASSWORD }}
          KELEO_RESEND_API_KEY: ${{ secrets.KELEO_RESEND_API_KEY }}
          KELEO_MAIL_FROM: ${{ secrets.KELEO_MAIL_FROM }}
